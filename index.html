<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUACKER STORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b12;
      color: white;
    }

    header {
      background: #151522;
      padding: 28px 15px;
      text-align: center;
      border-bottom: 2px solid #7c3cff;
    }

    header h1 {
      font-size: 30px;
      color: #a970ff;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .titulo {
      text-align: center;
      margin: 20px 0;
      font-size: 24px;
    }

    .producto {
      background: #171724;
      border: 1px solid #29293b;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .diamantes {
      font-size: 19px;
      font-weight: bold;
    }

    .precio {
      color: #b47cff;
      font-size: 19px;
      font-weight: bold;
    }

    .boton {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #7c3cff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:hover {
      background: #925cff;
    }

    .formulario {
      background: #151522;
      padding: 20px;
      border-radius: 15px;
      margin-top: 25px;
    }

    .formulario h2 {
      margin-bottom: 15px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #33334a;
      background: #0f0f18;
      color: white;
      font-size: 16px;
    }

    .resultado {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #202033;
      display: none;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 LUACKER STORE</h1>
  <p>Recargas Free Fire 🇧🇴</p>
</header>

<main class="contenedor">

  <h2 class="titulo">💎 DIAMANTES</h2>

  <div class="producto">
    <span class="diamantes">💎 100 Diamantes</span>
    <span class="precio">Bs 8</span>
  </div>

  <div class="producto">
    <span class="diamantes">💎 310 Diamantes</span>
    <span class="precio">Bs 22</span>
  </div>

  <div class="producto">
    <span class="diamantes">💎 520 Diamantes</span>
    <span class="precio">Bs 35</span>
  </div>

  <div class="producto">
    <span class="diamantes">💎 1060 Diamantes</span>
    <span class="precio">Bs 70</span>
  </div>

  <div class="producto">
    <span class="diamantes">💎 2180 Diamantes</span>
    <span class="precio">Bs 140</span>
  </div>

  <section class="formulario">

    <h2>🛒 Realizar pedido</h2>

    <label>Elige tu paquete:</label>

    <select id="paquete">
      <option value="100 Diamantes - Bs 8">
        100 Diamantes - Bs 8
      </option>

      <option value="310 Diamantes - Bs 22">
        310 Diamantes - Bs 22
      </option>

      <option value="520 Diamantes - Bs 35">
        520 Diamantes - Bs 35
      </option>

      <option value="1060 Diamantes - Bs 70">
        1060 Diamantes - Bs 70
      </option>

      <option value="2180 Diamantes - Bs 140">
        2180 Diamantes - Bs 140
      </option>
    </select>

    <input
      type="text"
      id="idff"
      placeholder="🆔 ID de Free Fire"
    >

    <input
      type="text"
      id="contacto"
      placeholder="📱 Número de contacto"
    >

    <button class="boton" onclick="crearPedido()">
      ✅ CONFIRMAR PEDIDO
    </button>

    <div class="resultado" id="resultado"></div>

  </section>

</main>

<footer>
  © 2026 LUACKER STORE
</footer>

<script>
function crearPedido() {

  const paquete = document.getElementById("paquete").value;
  const idff = document.getElementById("idff").value;
  const contacto = document.getElementById("contacto").value;
  const resultado = document.getElementById("resultado");

  if (idff === "" || contacto === "") {
    resultado.style.display = "block";
    resultado.innerHTML =
      "⚠️ Completa tu ID de Free Fire y tu número de contacto.";
    return;
  }

  resultado.style.display = "block";

  resultado.innerHTML =
    "<strong>✅ Pedido preparado</strong><br><br>" +
    "💎 Paquete: " + paquete + "<br>" +
    "🆔 ID: " + idff + "<br>" +
    "📱 Contacto: " + contacto + "<br><br>" +
    "📦 Tu pedido está listo para ser procesado.";
}
</script>

</body>
</html>
